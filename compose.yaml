services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-se_aprender}'
      POSTGRES_USER: '${DB_USERNAME:-se_aprender}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-se_aprender_local}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
