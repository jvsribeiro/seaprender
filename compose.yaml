services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-se_aprender}'
      MYSQL_USER: '${DB_USERNAME:-se_aprender}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-se_aprender_local}'
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-se_aprender_root}'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
